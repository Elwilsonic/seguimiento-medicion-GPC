name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  go-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting (gofmt)
        run: |
          UNFORMATTED_FILES=$(gofmt -l .)
          if [ -n "$UNFORMATTED_FILES" ]; then
            echo "Los siguientes archivos no están formateados:" >&2
            echo "$UNFORMATTED_FILES" >&2
            exit 1
          fi

      - name: Run tests
        run: |
          PACKAGES=$(go list ./... 2>/dev/null || true)
          if [ -z "$PACKAGES" ]; then
            echo "No hay paquetes Go para testear todavía."
            exit 0
          fi
          go test ./...
