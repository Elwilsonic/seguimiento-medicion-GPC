# Integración continua (TEC-02): controla el formato, corre el análisis
# estático (go vet, acción 8 de la Retrospectiva del Sprint 1) y corre los
# tests (con el detector de carreras) en cada Pull Request hacia main.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: gofmt y tests
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Go (versión de go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verificar formato (gofmt)
        run: |
          sin_formato=$(gofmt -l .)
          if [ -n "$sin_formato" ]; then
            echo "Archivos sin formatear (corré gofmt -w sobre ellos):"
            echo "$sin_formato"
            exit 1
          fi

      - name: Análisis estático (go vet ./...)
        run: |
          # Mientras el repositorio no tenga paquetes Go, no hay nada que analizar.
          if [ -z "$(go list ./... 2>/dev/null)" ]; then
            echo "Todavía no hay paquetes Go: no hay nada que analizar."
            exit 0
          fi
          # go vet detecta errores que compilan pero están mal (por ejemplo,
          # un formato de Printf que no coincide o un sync.Mutex copiado).
          go vet ./...

      - name: Correr los tests con cobertura (go test -race -cover ./...)
        run: |
          # Mientras el repositorio no tenga paquetes Go, no hay tests que correr.
          if [ -z "$(go list ./... 2>/dev/null)" ]; then
            echo "Todavía no hay paquetes Go: no hay tests para correr."
            exit 0
          fi
          # -race detecta accesos concurrentes sin protección (CA-01.7), sin
          # depender de la cantidad de procesadores del runner.
          go test -race -coverprofile=coverage.out ./...
          # Cobertura total del módulo, para comparar con la evidencia TDD del
          # Pull Request (acción 2 de la Retrospectiva del Sprint 1). Los tests
          # de PostgreSQL hacen t.Skip en el CI, así que esa parte no suma.
          go tool cover -func=coverage.out | tail -n 1
